name: Ingestao Automatica de Materiais

on:
  schedule:
    # Roda todo domingo às 03:00 AM (Horário UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite disparar manualmente pelo botão no site do GitHub

jobs:
  executar-raspador:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 groq

      - name: Executar script raspador
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python ingestor_aops.py

      - name: Salvar e enviar alteracoes para o GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add banco_provas.json
          git commit -m "Auto-update: Ingestao automatica de questoes" || echo "Nenhuma alteracao para salvar"
          git push
